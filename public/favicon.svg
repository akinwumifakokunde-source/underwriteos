<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stopColor="#00352f" />
      <stop offset="1" stopColor="#00524d" />
    </linearGradient>
    <linearGradient id="cgrad" x1="4" y1="4" x2="32" y2="33" gradientUnits="userSpaceOnUse">
      <stop stopColor="#008e8b" />
      <stop offset="1" stopColor="#00e5c9" />
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="39" height="39" rx="9" fill="url(#bg)" />
  <rect x="0.5" y="0.5" width="39" height="39" rx="9" stroke="#ffffff" strokeOpacity="0.08" />

  <!-- pixel dissolution -->
  <g>
    <rect x="10.6" y="8.6" width="2.2" height="2.2" rx="0.4" fill="#00e5c9" opacity="0.95" />
    <rect x="9" y="11.6" width="1.5" height="1.5" rx="0.3" fill="#00e5c9" opacity="0.78" />
    <rect x="7.4" y="6.6" width="1.8" height="1.8" rx="0.3" fill="#5cf2da" opacity="0.85" />
    <rect x="6" y="10.6" width="1.1" height="1.1" rx="0.2" fill="#5cf2da" opacity="0.6" />
    <rect x="5" y="5" width="1.4" height="1.4" rx="0.3" fill="#5cf2da" opacity="0.65" />
    <rect x="3" y="3.4" width="1" height="1" rx="0.2" fill="#00e5c9" opacity="0.45" />
    <rect x="8" y="28.4" width="1.4" height="1.4" rx="0.3" fill="#5cf2da" opacity="0.6" />
    <rect x="5" y="30.4" width="1" height="1" rx="0.2" fill="#00e5c9" opacity="0.4" />
    <rect x="10.6" y="30" width="1" height="1" rx="0.2" fill="#5cf2da" opacity="0.3" />
  </g>

  <!-- the "C" -->
  <path d="M 29.66 11.30 A 13 13 0 1 0 29.66 28.70" stroke="url(#cgrad)" stroke-width="6.5" stroke-linecap="round" />

  <!-- checkmark -->
